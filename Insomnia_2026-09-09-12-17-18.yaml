        meta:
          id: req_internal_update_counter
          description: Updates counter identity, priority/regular type, and mapped service types.
        method: PATCH
        body:
          mimeType: application/json
          text: |-
            {
              "counterName": "Updated Counter",
              "counterType": "priority",
              "serviceTypes": ["HM", "PR"]
            }
