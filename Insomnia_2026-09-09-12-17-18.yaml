  - name: Public API
    meta:
      id: fld_public
      description: Customer-facing endpoints. No staff headers required.
    children:
      - url: "{{ _.BASE_URL }}/api/public/branches/validate"
        name: POST Validate Branch
        meta:
          id: req_public_validate_branch
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "branch": {
                "code": "BR-001",
                "name": "Central Branch"
              }
            }
        headers:
          - name: Content-Type
            value: application/json
      - url: "{{ _.BASE_URL }}/api/public/queue"
        name: POST Create Ticket
        meta:
          id: req_public_create_ticket
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "branchCode": "BR-001",
              "name": "John Doe",
              "phoneNumber": "1234567890",
              "serviceType": "HM",
              "latitude": 3.139003,
              "longitude": 101.686855
            }
        headers:
          - name: Content-Type
            value: application/json
      - url: "{{ _.BASE_URL }}/api/public/branches/BR-001/queue/HM-001"
        name: GET Ticket by Branch and Number
